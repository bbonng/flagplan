<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>작전 평가판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 반 전체(조 카드 격자) → 조 상세: [작전별 보기] 큰 경기장 + 연습 기록 / [조원 평가] 조 계획서 점수 + 개인 실행 점수 */
:root{
  --bg:#EDF2EE; --surface:#FFFFFF; --ink:#15211A; --muted:#58675E; --line:#D0DAD3;
  --chip:#E1E9E3; --accent:#1D6B44; --accent-ink:#FFFFFF; --warn:#B45309; --warn-bg:#FDF1DC;
  --danger:#B42318; --ok:#1D6B44; --ok-bg:#E1F2E8;
  --display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#16201A; --ink:#E5ECE7; --muted:#9AA89F; --line:#2A3730;
  --chip:#202B24; --accent:#46B27B; --accent-ink:#05120B; --warn:#F2B357; --warn-bg:#3A2C14;
  --danger:#FF8A80; --ok:#6FD39C; --ok-bg:#183326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#16201A; --ink:#E5ECE7; --muted:#9AA89F; --line:#2A3730;
  --chip:#202B24; --accent:#46B27B; --accent-ink:#05120B; --warn:#F2B357; --warn-bg:#3A2C14;
  --danger:#FF8A80; --ok:#6FD39C; --ok-bg:#183326; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body)}
.app{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.title{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.title small{display:block;font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em;margin-bottom:4px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.banner{margin:0;font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;line-height:1.5}
.banner.ok{border-style:solid;border-color:var(--ok-bg);color:var(--ok)}
.banner.warn{border-style:solid;border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.stu-h .nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.onlyb{font:inherit;font-size:12px;font-weight:600;padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);cursor:pointer}
.onlyb[aria-pressed="true"]{background:var(--chip);color:var(--ink);border-color:var(--ink)}
.stu .ex-off{font-size:13px;color:var(--muted);margin:0}
.orph{border:1px dashed var(--warn);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.orph h5{margin:0;font-size:14px;color:var(--warn)}
.orph .hint{margin:0}
.orow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.orow select{font:inherit;font-size:14px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.sum{font-size:14px;color:var(--muted);margin:0 0 10px}
.sum b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--ink);font:inherit}
.card:hover{border-color:var(--accent)}
.card:disabled{cursor:default;opacity:.7}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.none{background:var(--chip);color:var(--muted)}
.members{font-size:13px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.th{display:flex;flex-direction:column;gap:3px;min-width:0}
.th canvas{width:100%;display:block;border-radius:4px}
.th .ph{aspect-ratio:25/30;border-radius:4px;border:1px dashed var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.th b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th span{font-size:11px;color:var(--muted)}
.th span.miss{color:var(--warn);font-weight:600}
.foot{font-size:12px;color:var(--muted)}

.dtop{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.btn{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.dtitle{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:6px}
.tab{flex:1 1 0;min-width:0;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit}
.tab b{display:block;font-family:var(--display);font-weight:400;font-size:16px}
.tab span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.tab:disabled{opacity:.45;cursor:default}
.dmain{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.dmain{grid-template-columns:minmax(0,1fr) 380px;align-items:start}}
.stage{min-width:0;display:flex;flex-direction:column;gap:10px}
.fwrap{display:flex;justify-content:center}
#big{display:block;border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.pname{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.pdesc{margin:0;line-height:1.7;max-width:64ch;white-space:pre-wrap}
.panel{display:flex;flex-direction:column;gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box h4{margin:0;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.box h4 small{font-weight:500;color:var(--muted);font-size:12px}
.roles{display:grid;gap:6px}
.role{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;font-size:14px}
.dot{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#10231A;border:2px solid #10231A;box-sizing:border-box;flex:none}
.optb{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#111;color:#fff}
.optb.no{background:var(--warn-bg);color:var(--warn)}
.optb.qb{background:var(--chip);color:var(--muted)}
.reps{display:flex;flex-direction:column;gap:6px}
.rep{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;cursor:pointer;background:transparent;color:var(--ink);font:inherit;text-align:left}
.rep[aria-pressed="true"]{border-color:var(--accent);background:var(--ok-bg)}
.rep .n{font-family:var(--display);font-size:15px;flex:none}
.rep .t{min-width:0}
.rep .x{margin-left:auto;color:var(--muted);font-size:12px;padding:2px 6px;border-radius:6px;flex:none}
.rec{display:flex;flex-direction:column;gap:10px;border:2px solid var(--accent);border-radius:10px;padding:10px}
.rec p{margin:0;font-size:13px;font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{font:inherit;font-size:13px;font-weight:600;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fol button[data-v="o"]{background:var(--ok-bg);color:var(--ok)}
.fol button[data-v="t"]{background:var(--warn-bg);color:var(--warn)}
.fol button[data-v="x"]{background:transparent;color:var(--danger);border-color:var(--danger)}
.hint{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.mk{font-weight:700}
.mk.o{color:var(--ok)}.mk.t{color:var(--warn)}.mk.x{color:var(--danger)}

/* 조원 평가 */
.evgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:900px){.evgrid{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start}}
.checks{display:flex;flex-direction:column;gap:6px;font-size:13px}
.checks div{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.checks b{min-width:110px}
.ok-t{color:var(--ok);font-weight:600}.warn-t{color:var(--warn);font-weight:600}
.lv{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;align-self:flex-start}
.lv button{font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.lv button:last-child{border-right:0}
.lv button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.crit{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5;min-height:1.5em}
.stu{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.stu-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.stu-h b{font-size:16px}
.stu-h .tot{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stu-h .tot strong{color:var(--ink);font-size:15px}
.ev3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.evp{background:var(--chip);border-radius:8px;padding:6px 8px;font-size:12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.evp .r{display:flex;align-items:center;gap:6px;font-weight:600}
.evp .dot{width:20px;height:20px;font-size:9px}
.evp .seq{font-size:14px;letter-spacing:.05em}
.evp .none{color:var(--muted)}
.stu input{padding:6px 8px;font-size:13px}
body.show .panel,body.show .hide-show,body.show .pdesc{display:none!important}
body.show .dmain{grid-template-columns:1fr}
@media (pointer:coarse){input,textarea,select{font-size:16px!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.conn{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;line-height:1.5}
.conn .st{flex:1 1 220px}
.conn input{width:150px;letter-spacing:2px;text-transform:uppercase}
.conn .btn{min-height:40px}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <h1 class="title"><small>FLAG FOOTBALL 수행평가 · 선생님</small>작전 평가판</h1>
    <select id="cls" aria-label="반"></select>
  </header>
  <div class="conn" id="conn">
    <span class="st" id="connSt"></span>
    <span id="keyBox" hidden><input id="inpKey" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="교사 열쇠" aria-label="교사 열쇠"> <button class="btn primary" id="btnKey">확인</button></span>
    <button class="btn" id="btnRefresh">새로고침</button>
  </div>
  <p class="banner" id="banner" role="status" aria-live="polite">학생들이 조 비밀번호로 제출한 계획서가 반·조별로 떠요.</p>

  <section id="overview">
    <p class="sum" id="sum"></p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="detail" hidden>
    <div class="dtop">
      <button class="btn ghost hide-show" id="back">← 반 전체</button>
      <h2 class="dtitle" id="dtitle"></h2>
      <div class="seg hide-show" id="viewSeg"><button data-view="play">작전별 보기</button><button data-view="eval">조원 평가</button></div>
      <button class="btn" id="showBtn" style="margin-left:auto">학생에게 보여주기</button>
    </div>

    <div id="playView">
      <nav class="tabs" id="tabs" style="margin-bottom:12px"></nav>
      <div class="dmain">
        <div class="stage">
          <div class="fwrap" id="fwrap"><canvas id="big" aria-label="작전 그림"></canvas></div>
          <h3 class="pname" id="pname"></h3>
          <p class="pdesc" id="pdesc"></p>
        </div>
        <div class="panel">
          <div class="box">
            <h4>역할과 옵션 <small id="optSum"></small></h4>
            <div class="roles" id="roles"></div>
          </div>
          <div class="box">
            <h4>연습 기록 <small>연습할 때마다 한 줄씩</small></h4>
            <div class="reps" id="reps"></div>
            <div id="recBox"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="evalView" hidden>
      <div class="evgrid">
        <div class="box">
          <h4>전술 설계 계획서 <small>조 점수 · 조원 모두 같은 점수</small></h4>
          <div class="checks" id="planChecks"></div>
          <div class="lv" id="planLv"></div>
          <p class="crit" id="planCrit"></p>
        </div>
        <div class="box">
          <h4>전술 실행 <small>개인 점수 · 연습 기록이 근거로 모여요</small></h4>
          <p class="hint">○ 화살표대로 방향을 바꿔 정확히 뜀 · △ 일부만 · ✕ 다르게 뜀. 왼쪽부터 연습한 순서예요. 패스 성공 여부는 기록하지 않아요.</p>
          <div id="stus" style="display:flex;flex-direction:column;gap:10px"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
const W=25,Y0=-9,Y1=21,H=Y1-Y0,D=Math.PI/180;
const FONT='"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const KEY='ff-review-proto-v2';
const PL=[
  {id:'qb',label:'QB',color:'#FFD23F',x:12.5,y:-5},
  {id:'c', label:'C', color:'#F1F1EC',x:12.5,y:0},
  {id:'p1',label:'X', color:'#FF8A3D',x:3,  y:-1},
  {id:'p2',label:'Y', color:'#5CD2F6',x:17, y:-1},
  {id:'p3',label:'Z', color:'#FF7BC2',x:22, y:-1}];
const PL6=[PL[0],PL[1],PL[2],{id:'p4',label:'W',color:'#9BE564',x:8.6,y:-1},PL[3],PL[4]];   // 6명 조 (학생용 v3)
const FORMS={
  '22':[{x:7,y:5.5},{x:18,y:5.5},{x:7,y:13.5},{x:18,y:13.5},{x:12.5,y:7.5,r:1}],
  '31':[{x:4.5,y:5.5},{x:12.5,y:5},{x:20.5,y:5.5},{x:12.5,y:13.5},{x:15.5,y:7.5,r:1}]};
const formOf=k=>FORMS[k].map(d=>({...d}));
const STAMP={fake:{ring:'#9B5DE5',t:'척'},give:{ring:'#E4572E',t:'줌'},option:{ring:'#2F80ED',t:'?'}};
const PLAN_LV={
  50:'세 전술에서 경로·역할을 명확히 제시하고, 수비의 어떤 반응을 이용해 어느 공간을 만들거나 쓰는지 구체적 근거와 함께 서술함.',
  40:'경로·역할과 노리는 공간은 서술하나, 수비의 반응과 연결한 근거가 다소 부족함.',
  30:'경로·역할은 제시하나 공간에 대한 서술이 부분적이며, 그림 설명에 그침.',
  20:'역할 제시가 불분명하거나 계획서가 미완성임.'};
const EXEC_LV={
  50:'세 전술 모두 경로와 타이밍을 정확히 지켜 실행하고, 공을 받지 않아도 수비를 데려가 팀의 공간을 만들어 냄.',
  40:'대부분의 전술에서 경로와 타이밍을 지키며 수비를 데려가나, 일부 플레이에서 이행이나 적극성이 다소 줄어듦.',
  30:'경로를 부분적으로 실행하며, 타이밍이나 방향 전환 지점이 계획과 다르고 수비를 데려가는 움직임은 절반 정도.',
  20:'계획대로의 실행이 제한적이며, 경로와 역할의 이행보다 공을 따라가는 움직임 위주.'};
const $=s=>document.querySelector(s);
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const clampPt=p=>[Math.min(W-0.3,Math.max(0.3,p[0])),Math.min(Y1-0.3,Math.max(Y0+0.3,p[1]))];

/* ---------- 예시 데이터 ---------- */
function mk(o){return {name:o.name,desc:o.desc,def:o.def,defense:formOf(o.def==='none'?'22':o.def),
  players:PL.map(p=>({...p,name:'',opt:(o.opt||{})[p.id]||0})),
  lines:o.lines.map(([type,owner,end,pts],i)=>({id:'l'+i,type,owner,end,pts})),
  stamps:(o.stamps||[]).map((s,i)=>({id:'s'+i,...s}))};}
const TPL={

/* ---------- 선생님 시트 [평가] 탭에 저장 ----------
   패드는 바로 쓰는 사본 + 아직 못 보낸 것(store.out)을 들고 있고, 시트가 기준이다.
   시트 키: plan|반|조 · exec|반|조|이름 · reps|반|조|작전번호. 예시 반(lab)은 시트에 보내지 않는다. */
store.out=store.out||{};
let SRV=null, flushing=false, flushT=0, failAt=0;   // SRV: null 모름 · true 켜짐 · false 저장소 코드가 옛 판
const cNo=c=>parseInt(String(c).split('-')[1],10);
const rowKey=(kind,c,g,x)=>kind+'|'+cNo(c)+'|'+g+(x!=null?'|'+x:'');
function valOf(k){const p=k.split('|'), lk='2-'+p[1]+'|'+p[2];
  if(p[0]==='plan') return store.plan[lk]||0;
  if(p[0]==='exec'){const e=(store.exec[lk]||{})[p.slice(3).join('|')]; return e?{score:e.score||0,memo:e.memo||'',only:!!e.only}:null;}
  if(p[0]==='reps') return store.reps[lk+'|'+p[3]]||[];
  return null;}
function applyRow(k,v){const p=k.split('|'), lk='2-'+p[1]+'|'+p[2];
  if(p[0]==='plan'){ if(v) store.plan[lk]=+v; else delete store.plan[lk]; }
  else if(p[0]==='exec'){ const o=v||{}; (store.exec[lk]=store.exec[lk]||{})[p.slice(3).join('|')]={score:+o.score||0,memo:String(o.memo||''),only:!!o.only}; }
  else if(p[0]==='reps'){ store.reps[lk+'|'+p[3]]=Array.isArray(v)?v:[]; }}
function localKeys(){const out=[];
  Object.keys(store.plan).forEach(lk=>{const [c,g]=lk.split('|'); if(cNo(c)>0&&store.plan[lk]) out.push(rowKey('plan',c,g));});
  Object.keys(store.exec).forEach(lk=>{const [c,g]=lk.split('|'); if(!(cNo(c)>0)) return;
    Object.keys(store.exec[lk]).forEach(n=>{const e=store.exec[lk][n]; if(e&&(e.score||e.memo||e.only)) out.push(rowKey('exec',c,g,n));});});
  Object.keys(store.reps).forEach(lk=>{const [c,g,i]=lk.split('|'); if(cNo(c)>0&&store.reps[lk]&&store.reps[lk].length) out.push(rowKey('reps',c,g,i));});
  return out;}

function mark(kind,g,x){ save(); if(!(cNo(cls)>0)) return; store.out[rowKey(kind,cls,g,x)]=1; save(); syncSt(); flushSoon(); }
function flushSoon(ms){clearTimeout(flushT); flushT=setTimeout(flush,ms==null?1500:ms);}
async function post(body,ms){
  const ctl=('AbortController' in window)?new AbortController():null, tm=setTimeout(()=>ctl&&ctl.abort(),ms||25000);
  try{const r=await fetch(storeUrl(),{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',signal:ctl?ctl.signal:undefined});
    if(!r.ok) throw new Error('HTTP '+r.status); return await r.json();}
  finally{clearTimeout(tm);}
}
async function flush(){
  if(flushing||SRV!==true) { syncSt(); return; }
  const ks=Object.keys(store.out); if(!ks.length){ syncSt(); return; }
  const key=lsGet('ff-review-key'); if(!storeUrl()||!key) return;
  flushing=true; syncSt();
  const batch=ks.slice(0,150), snap=batch.map(k=>JSON.stringify(valOf(k)));
  try{
    const j=await post({action:'eval_set',key,rows:batch.map(k=>({k,v:valOf(k)}))});
    if(j.ok){
      batch.forEach((k,i)=>{ if(JSON.stringify(valOf(k))===snap[i]) delete store.out[k]; });   // 보내는 동안 또 바뀐 건 남김
      (j.bad||[]).forEach(k=>{delete store.out[k]; (store.bad=store.bad||{})[k]=1;});
      store.syncAt=new Date().toISOString(); failAt=0; save();
    } else if(j.err==='action') SRV=false;
    else if(j.err==='key'){ lsDel('ff-review-key'); $('#keyBox').hidden=false; failAt=Date.now(); }
    else failAt=Date.now();
  }catch(e){ failAt=Date.now(); }
  flushing=false; syncSt();
  if(Object.keys(store.out).length&&SRV===true) flushSoon(failAt?20000:300);
}
function syncSt(){
  const b=$('#banner'), n=Object.keys(store.out).length, bad=Object.keys(store.bad||{}).length;
  let cls_='', t='';
  if(SRV===false){ cls_='warn'; t='점수·연습 기록이 아직 이 패드에만 저장돼요. 구글 시트의 저장소 코드를 새 버전으로 올리면 시트 [평가] 탭에 저장돼요.'; }
  else if(SRV===null){ t=n?'시트에 보낼 점수·기록 '+n+'개가 이 패드에 있어요. 저장소에 연결되면 보내요.':'학생들이 조 비밀번호로 제출한 계획서가 반·조별로 떠요. 점수·메모·연습 기록은 선생님 구글 시트 [평가] 탭에 저장돼요.'; if(n) cls_='warn'; }
  else if(flushing){ t='시트에 저장하는 중… ('+n+'개)'; }
  else if(n){ cls_='warn'; t='시트에 아직 못 보낸 점수·기록 '+n+'개 · 이 패드에 보관 중이에요'+(failAt?'. 인터넷이 연결되면 저절로 다시 보내요':''); }
  else { cls_='ok'; t='점수·메모·연습 기록이 모두 시트 [평가] 탭에 저장됐어요'+(store.syncAt?' · '+ago(store.syncAt):''); }
  if(bad) t+=' · 시트에 들어가지 못한 기록 '+bad+'개(너무 김)';

function mergeEvals(rows){
  const seen={};
  rows.forEach(r=>{ if(!r||!r.k) return; seen[r.k]=1; if(store.out[r.k]) return; applyRow(r.k,r.v); });
  if(!store.migrated){ localKeys().forEach(k=>{ if(!seen[k]) store.out[k]=1; }); store.migrated=true; }   // 처음 한 번: 이 패드에만 있던 점수 올리기
  else localKeys().forEach(k=>{ if(seen[k]||store.out[k]) return; const p=k.split('|'), lk='2-'+p[1]+'|'+p[2];   // 시트에서 지운 줄은 패드에서도 지움
    if(p[0]==='plan') delete store.plan[lk]; else if(p[0]==='exec'){ if(store.exec[lk]) delete store.exec[lk][p.slice(3).join('|')]; } else delete store.reps[lk+'|'+p[3]]; });
  save();
}

function zigzag(sp,amp,wl){
  const segs=[];let L=0;
  for(let i=0;i<sp.length-1;i++){const dx=sp[i+1][0]-sp[i][0],dy=sp[i+1][1]-sp[i][1],len=Math.hypot(dx,dy);segs.push({x:sp[i][0],y:sp[i][1],dx,dy,len,s:L});L+=len;}
  if(L<wl*1.5) return sp;
  const at=d=>{for(let i=0;i<segs.length;i++){const g=segs[i];if(d<=g.s+g.len||i===segs.length-1){const t=g.len?(d-g.s)/g.len:0,n=g.len||1;return [g.x+g.dx*t,g.y+g.dy*t,-g.dy/n,g.dx/n];}}};
  const zl=L-Math.min(wl*1.3,L*0.35),step=wl/2,out=[sp[0]];let sign=1;
  for(let d=step;d<zl-step*0.3;d+=step){const [x,y,nx,ny]=at(d);out.push([x+nx*amp*sign,y+ny*amp*sign]);sign=-sign;}
  const e=at(zl);out.push([e[0],e[1]]);out.push(sp[sp.length-1]);return out;
}
function arrow(a,b,col,lw){
  const c=R.ctx,ang=Math.atan2(b[1]-a[1],b[0]-a[0]),s=R.s*0.75+lw,w=s*0.55;
  const bx=b[0]-Math.cos(ang)*s,by=b[1]-Math.sin(ang)*s,nx=-Math.sin(ang),ny=Math.cos(ang);
  c.beginPath();c.moveTo(b[0],b[1]);c.lineTo(bx+nx*w,by+ny*w);c.lineTo(bx-nx*w,by-ny*w);c.closePath();
  c.fillStyle=col;c.fill();c.lineWidth=1.2;c.strokeStyle='rgba(8,25,15,.7)';c.stroke();
}
function stopBar(a,b,col,lw){

function render(cv,w,play,opts){
  opts=opts||{}; setup(cv,w); drawField();

  play.stamps.filter(s=>s.type==='zone').forEach(drawZone);
  play.lines.forEach(l=>drawLine(play,l,dim));

  play.players.forEach(p=>drawPlayer(p,!opts.rep));

function perp(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;if(!L)return dist(p,a);let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-(a[0]+t*dx),p[1]-(a[1]+t*dy));}
function rdp(pts,eps){if(pts.length<3)return pts.slice();const a=pts[0],b=pts[pts.length-1];let dm=0,idx=0;for(let i=1;i<pts.length-1;i++){const d=perp(pts[i],a,b);if(d>dm){dm=d;idx=i;}}if(dm>eps){const L=rdp(pts.slice(0,idx+1),eps),Rt=rdp(pts.slice(idx),eps);return L.slice(0,-1).concat(Rt);}return [a,b];}
function turn(a,b,c){const ux=b[0]-a[0],uy=b[1]-a[1],vx=c[0]-b[0],vy=c[1]-b[1],l1=Math.hypot(ux,uy),l2=Math.hypot(vx,vy);if(!l1||!l2)return 0;return Math.acos(Math.max(-1,Math.min(1,(ux*vx+uy*vy)/(l1*l2))));}
function cleanup(pts){pts=pts.slice();let ch=true;while(ch&&pts.length>2){ch=false;for(let i=1;i<pts.length-1;i++){const a=pts[i-1],b=pts[i],c=pts[i+1];if(turn(a,b,c)<20*D||dist(a,b)<0.9||(i===pts.length-2&&dist(b,c)<0.9)){pts.splice(i,1);ch=true;break;}}}return pts;}
function straighten(raw,start){const pts=[start.slice()];let away=false;for(const q of raw){if(!away&&dist(q,start)<0.7)continue;away=true;pts.push(q.slice());}if(pts.length<2)return pts;return cleanup(rdp(pts,0.85)).map(clampPt);}

    b.addEventListener('click',()=>{rec.fol[q.id]={o:'t',t:'x',x:'o'}[rec.fol[q.id]];renderRec();drawBig();});
    wrap.querySelector('#pFol').appendChild(b);
    const u=document.createElement('button'); u.textContent=q.label; u.setAttribute('aria-pressed',String(!!rec.pull[q.id]));
    u.addEventListener('click',()=>{rec.pull[q.id]=!rec.pull[q.id];renderRec();drawBig();});
    wrap.querySelector('#pPull').appendChild(u);
    const w=document.createElement('button'); w.textContent=q.label+(rec.paths.some(x=>x.pid===q.id)?' ✓':''); w.setAttribute('aria-pressed',String(recPath===q.id));
    w.addEventListener('click',()=>{recPath=recPath===q.id?null:q.id;renderRec();});
    wrap.querySelector('#pWho').appendChild(w);
  });
  const clip=wrap.querySelector('#clip'); clip.value=rec.clip; clip.addEventListener('input',()=>{rec.clip=clip.value.trim();});
  wrap.querySelector('#recSave').addEventListener('click',()=>{const rs=reps();rs.push(rec);shownRep=rs.length-1;rec=null;recPath=null;mark('reps',grp,pi);renderPlayView();});
  wrap.querySelector('#recCancel').addEventListener('click',()=>{rec=null;recPath=null;const rs=reps();shownRep=rs.length?rs.length-1:null;renderReps();renderRec();drawBig();});
}

/* ---------- 조원 평가 ---------- */
function lvButtons(box,cur,onPick){
  box.innerHTML='';
  [50,40,30,20].forEach(v=>{const b=document.createElement('button');b.textContent=v;b.setAttribute('aria-pressed',String(cur===v));
    b.addEventListener('click',()=>onPick(cur===v?0:v));box.appendChild(b);});
}
function renderEvalView(){
  const d=DATA()[grp], k=gk();
  const ch=$('#planChecks'); ch.innerHTML='';
  d.plays.forEach((p,i)=>{
    const row=document.createElement('div'); const b=document.createElement('b'); b.textContent=`작전 ${i+1} ${p?p.name:''}`; row.appendChild(b);
    const s=document.createElement('span');
    if(!p){s.className='warn-t';s.textContent='제출 안 함';}
    else{const parts=descParts(p.desc||''), bits=[];
      if(parts){[['route','경로와 역할'],['react','수비 반응'],['space','공간']].forEach(([key,lab])=>bits.push(`<span class="${parts[key]?'ok-t':'warn-t'}">${parts[key]?'✓':'빈칸'} ${lab}</span>`));}
      else bits.push('<span class="warn-t">세 칸 틀 없이 자유 서술</span>');
      if(optCount(p)<optN(p)) bits.push(`<span class="warn-t">옵션 ${optCount(p)}/${optN(p)}</span>`);
      s.innerHTML=bits.join(' · ');}
    row.appendChild(s); ch.appendChild(row);
  });
  const plan=store.plan[k]||0;
  lvButtons($('#planLv'),plan,v=>{store.plan[k]=v;mark('plan',grp);renderEvalView();});
  $('#planCrit').textContent=plan?PLAN_LV[plan]:'점수를 누르면 해당 기준이 여기에 보여요. 각 작전 설명은 「작전별 보기」에서 읽을 수 있어요.';

  const ex=store.exec[k]||(store.exec[k]={}), box=$('#stus'); box.innerHTML='';
  d.members.forEach(n=>{
    const e=ex[n]||(ex[n]={score:0,memo:''});
    const card=document.createElement('div'); card.className='stu';
    card.innerHTML=`<div class="stu-h"><span class="nm"><b></b><button class="onlyb" title="실행 평가 없이 계획서에만 참여하는 학생 (선생님 화면과 시트에만 보여요)">계획서만 참여</button></span><span class="tot"></span></div><div class="ev3"></div><div class="lv"></div><p class="crit"></p><input placeholder="메모 (예: 세 번째 연습부터 꺾는 지점 정확해짐)">`;
    card.querySelector('b').textContent=n;
    const ob=card.querySelector('.onlyb'); ob.setAttribute('aria-pressed',String(!!e.only));
    ob.addEventListener('click',()=>{e.only=!e.only; mark('exec',grp,n); renderEvalView();});
    const total=(plan||0)+(e.score||0);
    card.querySelector('.tot').innerHTML=e.only?`계획서 ${plan||'-'} · 실행 평가 제외`:`계획서 ${plan||'-'} + 실행 ${e.score||'-'} = <strong>${plan&&e.score?total:'-'}</strong>`;
    const ev3=card.querySelector('.ev3');
    d.plays.forEach((p,i)=>{
      const cell=document.createElement('div'); cell.className='evp';
      if(!p){cell.innerHTML=`<span class="none">작전 ${i+1} 없음</span>`;ev3.appendChild(cell);return;}
      const role=p.players.find(q=>q.name===n);
      if(!role){cell.innerHTML=`<span>작전 ${i+1}</span><span class="none">역할 없음</span>`;ev3.appendChild(cell);return;}
      const rs=repsOf(grp,i), seq=rs.map(r=>(r.fol||{})[role.id]).filter(Boolean);
      const pulls=rs.filter(r=>(r.pull||{})[role.id]).length;
      cell.innerHTML=`<span class="r"><span class="dot" style="background:${role.color}">${role.label}</span>작전 ${i+1}</span>`+
        (seq.length?`<span class="seq">${seq.map(v=>`<span class="mk ${v}">${MK[v].t}</span>`).join(' ')}</span><span>수비 데려감 ${pulls}회</span>`:'<span class="none">연습 기록 없음</span>');
      ev3.appendChild(cell);
    });
    if(e.only){ const lv=card.querySelector('.lv'); const p=document.createElement('p'); p.className='ex-off'; p.textContent='계획서에만 참여해서 전술 실행은 채점하지 않아요.'; lv.replaceWith(p); }
    else lvButtons(card.querySelector('.lv'),e.score,v=>{e.score=v;mark('exec',grp,n);renderEvalView();});
    card.querySelector('.crit').textContent=!e.only&&e.score?EXEC_LV[e.score]:'';
    const memo=card.querySelector('input'); memo.value=e.memo||''; memo.addEventListener('input',()=>{e.memo=memo.value;mark('exec',grp,n);});
    box.appendChild(card);
  });
  /* 제출본에 없는 이름의 점수: 학생이 이름을 고쳐 다시 냈을 때 */
  const orph=Object.keys(ex).filter(n=>!d.members.includes(n)&&ex[n]&&(ex[n].score||ex[n].memo||ex[n].only));
  if(orph.length){
    const o=document.createElement('div'); o.className='orph';
    o.innerHTML='<h5>지금 조원 명단에 없는 이름의 점수</h5><p class="hint">학생이 이름을 고쳐서 다시 냈을 수 있어요. 맞는 학생에게 옮겨 주세요.</p>';
    orph.forEach(n=>{
      const e=ex[n], row=document.createElement('div'); row.className='orow';
      const b=document.createElement('b'); b.textContent=n;
      const info=document.createElement('span'); info.textContent=(e.only?'계획서만 참여':'실행 '+(e.score||'-'))+(e.memo?' · '+e.memo:'');
      const sel=document.createElement('select'); sel.setAttribute('aria-label',n+' 점수를 옮길 학생');
      [['','옮길 학생'],...d.members.map(m=>[m,m+(ex[m]&&(ex[m].score||ex[m].only)?' (점수 있음)':'')])].forEach(([v,t])=>{const op=document.createElement('option');op.value=v;op.textContent=t;sel.appendChild(op);});
      const mv=document.createElement('button'); mv.className='btn'; mv.textContent='옮기기';
      mv.addEventListener('click',()=>{const to=sel.value; if(!to) return;
        if(ex[to]&&(ex[to].score||ex[to].memo||ex[to].only)&&!confirm(to+'에게 이미 점수나 메모가 있어요. '+n+'의 것으로 바꿀까요?')) return;
        ex[to]={...e}; delete ex[n]; mark('exec',grp,to); mark('exec',grp,n); renderEvalView();});
      const del=document.createElement('button'); del.className='btn ghost'; del.textContent='지우기';
      del.addEventListener('click',()=>{ if(!confirm(n+'의 점수·메모를 지울까요?')) return; delete ex[n]; mark('exec',grp,n); renderEvalView();});
      row.append(b,info,sel,mv,del); o.appendChild(row);
    });
    box.appendChild(o);
  }
}

/* ---------- 큰 경기장 ---------- */
const big=$('#big');
function bigWidth(){const ww=$('#fwrap').clientWidth;const avail=Math.max(340,window.innerHeight-(document.body.classList.contains('show')?120:230));return Math.max(Math.min(ww,300),Math.floor(Math.min(ww,avail*W/H)));}
function drawBig(){
  if(grp==null||view!=='play') return;
  const p=curPlay(), rep=rec||(shownRep!=null?reps()[shownRep]:null);
  render(big,bigWidth(),p,{rep,live:()=>{ if(drag&&drag.raw.length>1){line(drag.raw.map(q=>[sx(q[0]),sy(q[1])]),'rgba(255,255,255,.7)',2);} }});
}
function fieldPt(e){const r=big.getBoundingClientRect(),s=r.width/W;return [(e.clientX-r.left)/s,Y1-(e.clientY-r.top)/s];}
big.addEventListener('pointerdown',e=>{
  if(!rec||!recPath) return; e.preventDefault();
  drag={raw:[clampPt(fieldPt(e))],pid:e.pointerId}; try{big.setPointerCapture(e.pointerId);}catch(_){} drawBig();
});
big.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pid)return;const p=fieldPt(e),l=drag.raw[drag.raw.length-1];if(dist(p,l)>0.12)drag.raw.push(p);drawBig();});
function endDraw(e){
  if(!drag||e.pointerId!==drag.pid) return; const raw=drag.raw; drag=null;
  const pl=curPlay().players.find(q=>q.id===recPath);
  if(e.type==='pointerup'&&raw.length>3&&pl){const pts=straighten(raw,[pl.x,pl.y]);
    if(pts.length>1){rec.paths=rec.paths.filter(x=>x.pid!==recPath);rec.paths.push({pid:recPath,pts});if(rec.fol[recPath]==='o')rec.fol[recPath]='t';renderRec();}}
  drawBig();
}
big.addEventListener('pointerup',endDraw); big.addEventListener('pointercancel',endDraw);

let rt=0;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(grp!=null)drawBig();else drawThumbs();},120);});
/* ---------- 받아 오기 ---------- */
function connStatus(msg){ $('#connSt').textContent=msg; }
async function fetchReal(){
  const url=storeUrl();
  if(!url){ connStatus('작전 저장소 주소가 아직 없어요'); return; }
  const key=lsGet('ff-review-key');
  if(!key){ $('#keyBox').hidden=false; connStatus('구글 시트 [작전판 > 교사 열쇠 보기]의 열쇠를 한 번만 넣어 주세요'); return; }
  $('#keyBox').hidden=true; $('#btnRefresh').disabled=true;
  connStatus((REAL?'마지막으로 받은 자료를 보여 주는 중 · ':'')+'최신 계획서를 받는 중…');
  try{
    const ctl=('AbortController' in window)?new AbortController():null, tm=setTimeout(()=>ctl&&ctl.abort(),25000);
    const r=await fetch(url,{method:'POST',body:JSON.stringify({action:'plan_teacher',key}),headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',signal:ctl?ctl.signal:undefined});
    clearTimeout(tm); const j=await r.json();
    if(!j.ok){ connStatus(j.msg||'받지 못했어요'); if(j.err==='key'){ lsDel('ff-review-key'); $('#keyBox').hidden=false; } return; }
    REAL={teams:j.teams||[],plans:j.plans||[],closed:j.closed||'',at:new Date().toISOString()};
    lsSet('ff-review-cache',JSON.stringify(REAL));
    if(Array.isArray(j.evals)){ SRV=true; mergeEvals(j.evals); rerender(); flushSoon(200); } else SRV=false;
    syncSt();
    connStatus('계획서 '+REAL.plans.length+'조 · 방금 받음'+(REAL.closed?' · 제출 마감: '+REAL.closed:''));
    if(grp==null) renderOverview();
  }catch(e){ failAt=Date.now(); syncSt();
    connStatus(REAL?('연결이 안 돼서 '+ago(REAL.at)+'에 받은 자료를 보여 줘요'):'저장소에 연결하지 못했어요. 인터넷을 확인해 주세요');
  }finally{ $('#btnRefresh').disabled=false; }
}
$('#btnRefresh').addEventListener('click',fetchReal);
$('#btnKey').addEventListener('click',()=>{const k=$('#inpKey').value.trim().toUpperCase(); if(!k) return; lsSet('ff-review-key',k); fetchReal();});
$('#inpKey').addEventListener('keydown',e=>{if(e.key==='Enter') $('#btnKey').click();});
if(REAL) connStatus('계획서 '+REAL.plans.length+'조 · '+ago(REAL.at)+' 받음');
renderOverview();
syncSt();
fetchReal();
window.addEventListener('online',()=>{ if(SRV===true) flushSoon(300); else fetchReal(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&Object.keys(store.out).length) flush(); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{if(grp!=null)drawBig();else drawThumbs();});
})();
</script>
